name: 'ci'
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set node version to 16
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
